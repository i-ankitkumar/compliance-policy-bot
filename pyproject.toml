[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policyrag"
version = "0.1.0"
description = "A dependency-free RAG bot that answers questions over internal policy documents with citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ankit Kumar" }]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.34.0"]
dev = ["pytest>=7.0"]

[project.scripts]
policyrag = "policyrag.cli:main"

[tool.setuptools.packages.find]
include = ["policyrag*"]
